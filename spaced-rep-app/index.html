<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=410">
    <!-- Always dark, in both themes. The bar is painted from one source and its
         icon colour is chosen from another, so a value that changed with the theme
         left an installed PWA with dark icons on a dark bar — invisible. -->
    <meta name="theme-color" content="#0f172a">
    <title>Spaced Repetition</title>
    <!-- Runs before <body> is parsed: paints the ground and reserves the popup
         height, so neither is decided after an async read. Not deferred. -->
    <script src="core/prepaint.js"></script>
    <link rel="stylesheet" href="core/app.css">
</head>

<body>
    <!-- Icon sprite: repetition marks for bubble-dots-group, drawn with <use href="#mark-..."> -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none;" aria-hidden="true">
        <symbol id="mark-dot-dark" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="#52525bcc" /></symbol>
        <symbol id="mark-dot-red" viewBox="0 0 10 10"><circle cx="5" cy="5" r="5" fill="#ff1744" /></symbol>
        <symbol id="mark-ring-dark" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.5" fill="none" stroke="#52525bcc" stroke-width="3" /></symbol>
        <symbol id="mark-ring-red" viewBox="0 0 10 10"><circle cx="5" cy="5" r="3.5" fill="none" stroke="#ff1744" stroke-width="3" /></symbol>
    </svg>

    <script src="core/base.js" defer></script>
    <script src="core/srs.js" defer></script>
    <script src="core/storage.js" defer></script>
    <script src="core/seed.js" defer></script>
    <script src="core/store.js" defer></script>
    <script src="registry.js" defer></script>
    <script src="catalog.js" defer></script>
    <script src="web.js" defer></script>
</body>

</html>
