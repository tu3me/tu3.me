<!DOCTYPE html>
<html lang="en" class="game-page">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=350">
    <!-- Always dark, in both themes. The bar is painted from one source and its
         icon colour is chosen from another, so a value that changed with the theme
         left an installed PWA with dark icons on a dark bar — invisible. -->
    <meta name="theme-color" content="#0f172a">
    <title>Flashcards — Spaced Repetition</title>
    <!-- Runs before <body> is parsed: paints the ground and reserves the popup
         height, so neither is decided after an async read. Not deferred. -->
    <script src="core/prepaint.js"></script>
    <link rel="stylesheet" href="core/app.css">
    <!-- The game's own ground, in both themes: every game has one of its
         own (the owner, 22 November 2026), here the room the cabinet stands
         in -- by day the owner's colour, at night the same a quarter as
         light, darker than the cabinet's own wood, which the lamp lights.
         Here, in its page, because it has to be right in the first frame,
         before any script; the game's code takes it from here too
         (page.ground). -->
    <style>
        :root { --ground: #2b2720; }
        :root[data-theme="light"] { --ground: #b3a287; }
    </style>
</head>

<body>
    <script src="core/tokens.js" defer></script>
    <script src="core/base.js" defer></script>
    <script src="core/track.js" defer></script>
    <script src="core/srs.js" defer></script>
    <script src="core/storage.js" defer></script>
    <script src="core/migrate.js" defer></script>
    <script src="core/speech.js" defer></script>
    <script src="core/store.js" defer></script>
    <script src="core/remote.js" defer></script>
    <script src="core/sync.js" defer></script>
    <script src="core/sfx.js" defer></script>
    <script src="core/game-page.js" defer></script>
    <script src="flashcards/flashcards.js" defer></script>
    <script src="web.js" defer></script>
</body>

</html>
