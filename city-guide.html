<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta id="v-meta" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Touristic Guide</title>
    <script src="https://api-maps.yandex.ru/2.1/?apikey=d920dab2-5680-4223-ad9c-afedf7d87151&lang=en_US" type="text/javascript"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { height: 100%; overflow: hidden; background: #212a33; -webkit-tap-highlight-color: transparent; }
        #app { display: flex; flex-direction: column; height: 100vh; max-width: 60vh; margin: auto; }
        #map-container { height: 30vh; flex: none; z-index: 5; box-shadow: 0 15px 35px #00000055; }
        #map { width: 100%; height: 100%; }
        #resizer-bar { display: flex; justify-content: space-between; align-items: center; height: 30px; background: #212a33; z-index: 10; flex-shrink: 0; }
        .resizer-link { text-decoration: none; color: #acbdcc; font-weight: 600; font-size: 14px; padding: 0 20px; }
        #resizer-handle { flex: 1; height: 100%; display: flex; justify-content: center; align-items: center; cursor: row-resize; touch-action: none; }
        #resizer-handle::before { content: ""; width: 30px; height: 4px; background: #acbdcc; border-radius: 2px; }
        #content-container { flex: 1; overflow-y: auto; padding: 20px; background: #415560; scroll-behavior: smooth; }
        .attraction { margin-bottom: 20px; padding: 10px; border-radius: 8px; background: #fff; scroll-margin-top: 20px; transition: background 1s; }
        .highlight-flash { animation: flash-animation 1s ease-out; }
        @keyframes flash-animation { 0% { background: rgb(174, 216, 255) } 100% { background: #fff; } }
        .attraction-header { display: flex; justify-content: space-between; align-items: center; }
        .num-btn { background: #fff; color: #7c7c7c; border: 3px solid #60b8ff; border-radius: 50%; width: 32px; height: 32px; font-weight: bold; cursor: pointer; }
        .gallery { display: flex; gap: 15px; padding: 10px 0; flex-wrap: wrap; }
        .gallery-item { flex: 1 1 calc(33.333% - 15px); min-width: 100px; font-size: 13px; font-weight: 600; }
        .gallery-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; border-radius: 8px; cursor: pointer; display: block; }
        .media-box { position: relative; width: 100%; aspect-ratio: 3/4; margin-bottom: 5px; }
        .video-links { position: absolute; bottom: 0; width: 100%; display: flex; justify-content: center; gap: 5px; background: #00000099; padding: 4px 0; border-radius: 0 0 8px 8px; pointer-events: none; }
        .video-links a { pointer-events: auto; }
        .video-links img { width: 20px; height: 20px; }
        #fullscreen-viewer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; display: none; justify-content: center; align-items: center; }
        #fullscreen-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        #fullscreen-video-links { position: absolute; bottom: 40px; width: 100%; display: none; justify-content: center; gap: 20px; z-index: 2005; }
        #fullscreen-video-links img { width: 48px; height: 48px; border-radius: 12px; }
    </style>
</head>
<body>
<div id="app">
    <div id="map-container"><div id="map"></div></div>
    <div id="resizer-bar">
        <a href="#" class="resizer-link">tu3.me</a>
        <div id="resizer-handle"></div>
        <a href="#" class="resizer-link">Байконур ↗</a>
    </div>
    <div id="content-container">
        <div class="attraction" id="attr-0">
            <div class="attraction-header"><h2>Attraction 1</h2><button class="num-btn" data-index="0" data-lat="45.6232" data-lng="63.3140">1</button></div>
            <div class="gallery" id="gal-0">
                <div class="gallery-item">
                    <div class="media-box">
                        <img class="gallery-img" src="https://picsum.photos/id/10/800/1200" onclick="openFullscreen(this, 0)">
                        <div class="video-links">
                            <a href="https://tiktok.com" target="_blank"><img src="https://img.icons8.com/color/48/tiktok--v1.png"></a>
                            <a href="https://youtube.com" target="_blank"><img src="https://img.icons8.com/color/48/youtube-play.png"></a>
                        </div>
                    </div>
                    <span>Video tour</span>
                </div>
                <div class="gallery-item"><img class="gallery-img" src="https://picsum.photos/id/11/800/1200" onclick="openFullscreen(this, 0)"><span>Interior</span></div>
            </div>
        </div>
    </div>
</div>

<div id="fullscreen-viewer">
    <img id="fullscreen-img" src="">
    <div id="fullscreen-video-links"></div>
</div>

<script>
    ymaps.ready(() => {
        const myMap = new ymaps.Map("map", { center: [45.6232, 63.3140], zoom: 13 });
        const placemarks = [];
        document.querySelectorAll('.num-btn').forEach(btn => {
            const idx = parseInt(btn.dataset.index), coords = [parseFloat(btn.dataset.lat), parseFloat(btn.dataset.lng)];
            const pm = new ymaps.Placemark(coords, { iconContent: idx + 1 }, { preset: 'islands#blueCircleIcon' });
            pm.events.add('click', () => { 
                placemarks.forEach((p, i) => p.options.set('preset', i === idx ? 'islands#redCircleIcon' : 'islands#blueCircleIcon'));
                const attr = document.getElementById(`attr-${idx}`);
                attr.classList.remove('highlight-flash'); void attr.offsetWidth; attr.classList.add('highlight-flash');
                attr.scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
            myMap.geoObjects.add(pm); placemarks.push(pm);
            btn.onclick = () => { pm.events.fire('click'); myMap.setCenter(coords, 15, { duration: 500 }); };
        });
        
        const rh = document.getElementById('resizer-handle'), mc = document.getElementById('map-container');
        let drag = false;
        rh.onpointerdown = () => { drag = true; mc.style.pointerEvents = 'none'; };
        document.onpointermove = (e) => { if(drag) { mc.style.height = Math.max(40, Math.min(e.clientY, window.innerHeight-150))+'px'; myMap.container.fitToViewport(); }};
        document.onpointerup = () => { drag = false; mc.style.pointerEvents = 'auto'; };
    });

    const viewer = document.getElementById('fullscreen-viewer'), fsImg = document.getElementById('fullscreen-img'), fsLinks = document.getElementById('fullscreen-video-links'), vMeta = document.getElementById('v-meta');
    let imgs = [], iIdx = 0, aIdx = 0;

    function openFullscreen(el, attrIdx) {
        aIdx = attrIdx;
        imgs = Array.from(document.getElementById(`gal-${attrIdx}`).querySelectorAll('.gallery-img')).map(img => img.src);
        iIdx = imgs.indexOf(el.src);
        vMeta.content = "width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes";
        updateFs();
        viewer.style.display = 'flex';
    }

    function updateFs() {
        fsImg.src = imgs[iIdx];
        const links = document.getElementById(`gal-${aIdx}`).querySelectorAll('.gallery-item')[iIdx]?.querySelector('.video-links');
        fsLinks.innerHTML = links ? links.innerHTML : '';
        fsLinks.style.display = links ? 'flex' : 'none';
    }

    viewer.onclick = (e) => {
        if (e.target.closest('#fullscreen-video-links')) return;
        if (window.visualViewport && window.visualViewport.scale > 1.05) return;

        const x = e.clientX / window.innerWidth;
        if (x < 0.4) { // Left 40%
            if (iIdx > 0) { iIdx--; updateFs(); }
        } else if (x > 0.6) { // Right 40%
            if (iIdx < imgs.length - 1) { iIdx++; updateFs(); }
        } else { // Center 20% or backdrop
            viewer.style.display = 'none';
            //vMeta.content = "width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no";
        }
    };
</script>
</body>
</html>
