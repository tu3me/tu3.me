<!doctype html><meta charset="utf-8"><title>Сравнение окантовки</title>
<style>body{margin:0;padding:8px;background:#12212b;color:#e9eef2;font:12px 'Segoe UI',Arial,sans-serif}
.row{display:flex;gap:2px;margin-bottom:14px}.l{background:rgb(232,223,208);color:#222;padding:10px;border-radius:12px}
figure{margin:0;text-align:center;flex:1}figure svg{width:100%;height:auto;display:block}figcaption{margin-top:2px}
button{font:inherit;font-size:14px;padding:7px 18px;margin:0 0 10px;border:0;border-radius:8px;background:#ffd34d;color:#222;cursor:pointer}</style>
<button id="b">Пауза</button>
<div class="row" id="dark"></div><div class="row l" id="light"></div>
<script>
const SET = [["66-straight-dark","72-straight-light","66 · ровная","72 · ровная"],
  ["91-wavy-dark","91-wavy-light","91 · мелкая"],["92-wavy-dark","92-wavy-light","92 · крупная"],
  ["93-wavy-dark","93-wavy-light","93 · толще"],["94-wavy-dark","94-wavy-light","94 · ещё толще"],
  ["95-wavy-dark","95-wavy-light","95 · как 94, кривые"],
  ["96-wavy-dark","96-wavy-light","96 · без волны, 40"]];
const get = (f) => fetch(f + ".svg").then((r) => r.text());
// the files are inlined, not <img>: an image is a picture of an animation, and a
// button cannot reach into it to stop it
Promise.all(SET.flatMap(([d, l, a, b]) => [get(d), get(l)])).then((t) => {
  SET.forEach(([d, l, a, b], i) => {
    document.getElementById("dark").insertAdjacentHTML("beforeend", `<figure>${t[i * 2]}<figcaption>${a}</figcaption></figure>`);
    document.getElementById("light").insertAdjacentHTML("beforeend", `<figure>${t[i * 2 + 1]}<figcaption>${b || a}</figcaption></figure>`);
  });
  start();
});
function start() {
  const btn = document.getElementById("b");
  const anims = () => [...document.querySelectorAll(".rim")].flatMap((p) => p.getAnimations());
  // our own state: playState of a pausing animation lags a frame behind the click
  let mode = "running";
  const label = () => { btn.textContent = { running: "Пауза", paused: "Продолжить", finished: "Запустить сначала" }[mode]; };
  btn.onclick = () => {
    const a = anims();
    if (mode === "finished") { a.forEach((x) => { x.currentTime = 0; x.play(); }); mode = "running"; }
    else if (mode === "running") {
      // the time is pinned at the click, so the line stops where it was when pressed
      a.forEach((x) => { const t = x.currentTime; x.pause(); x.currentTime = t; });
      mode = "paused";
    } else { a.forEach((x) => x.play()); mode = "running"; }
    label();
  };
  Promise.all(anims().map((x) => x.finished)).then(() => { if (mode === "running") { mode = "finished"; label(); } });
  btn.addEventListener("click", () => {
    // a restart or a resume has a new end to wait for
    if (mode === "running") Promise.all(anims().map((x) => x.finished)).then(() => { if (mode === "running") { mode = "finished"; label(); } }, () => {});
  });
  label();
}
</script>
