<!DOCTYPE html>

<title>Каталог v6: бабблы сейчас и с неровными краями</title>
<!--
    A draft, not the app: the catalog as it is published, its colours, sizes and
    type, and only the bubbles changed -- smaller corners and edges a little
    uneven (the owner, 25 November 2026). One flat colour each, as they are
    now: no gradient, no outline and no shadow. CSS alone, the shapes written
    down below. Every set is here twice, as it is now and in the new shape,
    side by side where there is room and one under the other where there is
    not.

    The bubbles were worn at the corners for a moment, specks and strokes of a
    darker shade; the owner had that taken away the same day.

    Opened as a file, it needs nothing but itself. The words, their stages and
    their marks are made up.
-->
<style>
    * { box-sizing: border-box; scrollbar-width: none; }
    html, body { margin: 0; }
    body { background: #1b1f24; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    /* The draft's own controls, outside the app */
    .tools { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; padding: 10px 14px; background: #1b1f24; color: #b9c1c9; font-size: 13px; }
    .tools span { display: inline-flex; align-items: center; gap: 4px; }
    .tools button { padding: 3px 9px; border: 1px solid #3a424b; border-radius: 7px; background: transparent; color: #b9c1c9; font: inherit; cursor: pointer; }
    .tools button[aria-pressed="true"] { background: #39434e; color: #fff; border-color: #55616d; }

    .screens { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 20px; padding: 6px 0 40px; }
    .screen { width: 380px; min-height: 600px; border-radius: 10px; overflow: hidden; }
    @media (max-width: 480px) {
        .screens { padding-top: 0; }
        .screen { border-radius: 0; }
    }

    /* The app's own page: 350 wide, shown at the default 380 -- see app.css */
    .app { width: 350px; zoom: calc(380 / 350); padding: 6.8px; font-size: 14.3px; user-select: none; }
    .app button { font-family: inherit; }

    /* A set as it is now and in the new shape: two columns, each as wide as the
       catalog's own, or one where the window has no room for two */
    .pairs { display: grid; grid-template-columns: 336.4px; gap: 14px 12px; margin-top: 2px; align-items: start; }
    .caption { margin: 0 0 4px; padding-left: 2px; font-size: 11.3px; font-weight: 600; }
    @media (min-width: 790px) {
        .screen { width: 758.3px; }
        .app { width: 698.4px; }
        .pairs { grid-template-columns: 336.4px 336.4px; }
    }

    /* As createBubble in app/catalog.js */
    .bubble { position: relative; display: inline-flex; flex: 0 1 auto; flex-direction: column; align-items: center; justify-content: center; min-width: 41px; max-width: 100%; padding: 5.1px 8.5px; border-radius: 12px; background: var(--tone); text-align: center; cursor: pointer; }
    .bubble .word { max-width: 100%; font-size: 13.3px; font-weight: 800; line-height: 1.15; word-break: break-word; overflow-wrap: anywhere; }
    .bubble .trans { max-width: 100%; font-size: 13.3px; font-weight: 600; line-height: 1.1; word-break: break-word; overflow-wrap: anywhere; }
    .bubble .dots { display: flex; align-items: center; justify-content: center; max-width: 100%; margin: 2.6px; font-size: 6px; line-height: 1; }

    /*
     * The new edge. The colour moves to a layer of its own under the words and
     * is cut to a shape there, for the badge, which hangs over the corner, not
     * to be cut with it. Where shape() is not known it is simply not cut: a
     * bubble with small round corners.
     */
    .worn .bubble { isolation: isolate; background: none; border-radius: 6px; }
    .worn .bubble::before { content: ''; position: absolute; inset: -0.4px; z-index: -1; border-radius: 6px; background: var(--tone); clip-path: var(--edge); pointer-events: none; }
    .worn .bubble:nth-child(7n+1) { --edge: shape(from 5.1px 0.63px, curve to 43% 0.24px with 24% 0.59px, curve to calc(100% - 5.3px) 0.77px with 68% 0.12px, curve to calc(100% - 0.38px) 5.3px with calc(100% - 0.5px) 0.5px, curve to calc(100% - 0.11px) 43% with calc(100% - 0.74px) 30%, curve to calc(100% - 1.21px) calc(100% - 6.2px) with calc(100% - 0.82px) 72%, curve to calc(100% - 6.2px) calc(100% - 0.78px) with calc(100% - 0.5px) calc(100% - 0.5px), curve to 58% calc(100% - 0.08px) with 76% calc(100% - 0.24px), curve to 5.1px calc(100% - 0.3px) with 22% calc(100% - 0.97px), curve to 0.41px calc(100% - 5.1px) with 0.5px calc(100% - 0.5px), curve to 0.74px 48% with 0.65px 74%, curve to 0.62px 5.1px with 0.83px 27%, curve to 5.1px 0.82px with 0.5px 0.5px); }
    .worn .bubble:nth-child(7n+2) { --edge: shape(from 5.1px 0.01px, curve to 39% 0.6px with 23% 0.86px, curve to calc(100% - 5.6px) 0.75px with 74% 0.0px, curve to calc(100% - 0.78px) 5.6px with calc(100% - 0.5px) 0.5px, curve to calc(100% - 1.22px) 53% with calc(100% - 0.2px) 27%, curve to calc(100% - 0.07px) calc(100% - 5.6px) with calc(100% - 1.02px) 71%, curve to calc(100% - 5.6px) calc(100% - 0.64px) with calc(100% - 0.5px) calc(100% - 0.5px), curve to 55% calc(100% - 0.85px) with 77% calc(100% - 0.02px), curve to 4.3px calc(100% - 0.08px) with 32% calc(100% - 0.64px), curve to 0.11px calc(100% - 4.3px) with 0.5px calc(100% - 0.5px), curve to 1.23px 56% with 0.14px 76%, curve to 1.21px 5.1px with 0.67px 28%, curve to 5.1px 0.7px with 0.5px 0.5px); }
    .worn .bubble:nth-child(7n+3) { --edge: shape(from 4.6px 0.23px, curve to 37% 0.83px with 19% 0.8px, curve to calc(100% - 5.6px) 0.23px with 67% 0.66px, curve to calc(100% - 0.27px) 5.6px with calc(100% - 0.5px) 0.5px, curve to calc(100% - 0.37px) 55% with calc(100% - 0.16px) 24%, curve to calc(100% - 1.24px) calc(100% - 5.6px) with calc(100% - 1.04px) 71%, curve to calc(100% - 5.6px) calc(100% - 1.09px) with calc(100% - 0.5px) calc(100% - 0.5px), curve to 62% calc(100% - 1.11px) with 80% calc(100% - 1.03px), curve to 6.0px calc(100% - 0.93px) with 24% calc(100% - 0.99px), curve to 0.32px calc(100% - 6.0px) with 0.5px calc(100% - 0.5px), curve to 1.06px 57% with 1.12px 78%, curve to 0.71px 4.6px with 0.54px 26%, curve to 4.6px 1.11px with 0.5px 0.5px); }
    .worn .bubble:nth-child(7n+4) { --edge: shape(from 4.3px 0.34px, curve to 38% 0.36px with 17% 0.82px, curve to calc(100% - 5.7px) 0.38px with 76% 1.09px, curve to calc(100% - 0.49px) 5.7px with calc(100% - 0.5px) 0.5px, curve to calc(100% - 1.14px) 50% with calc(100% - 0.28px) 29%, curve to calc(100% - 0.45px) calc(100% - 5.6px) with calc(100% - 0.33px) 78%, curve to calc(100% - 5.6px) calc(100% - 0.19px) with calc(100% - 0.5px) calc(100% - 0.5px), curve to 58% calc(100% - 0.83px) with 80% calc(100% - 0.21px), curve to 6.3px calc(100% - 0.81px) with 23% calc(100% - 0.74px), curve to 0.03px calc(100% - 6.3px) with 0.5px calc(100% - 0.5px), curve to 0.34px 54% with 0.5px 77%, curve to 1.12px 4.3px with 0.12px 29%, curve to 4.3px 0.86px with 0.5px 0.5px); }
    .worn .bubble:nth-child(7n+5) { --edge: shape(from 6.3px 1.23px, curve to 34% 0.07px with 18% 1.07px, curve to calc(100% - 4.0px) 1.25px with 69% 0.15px, curve to calc(100% - 0.58px) 4.0px with calc(100% - 0.5px) 0.5px, curve to calc(100% - 0.44px) 54% with calc(100% - 0.33px) 27%, curve to calc(100% - 1.17px) calc(100% - 5.8px) with calc(100% - 0.26px) 75%, curve to calc(100% - 5.8px) calc(100% - 1.0px) with calc(100% - 0.5px) calc(100% - 0.5px), curve to 53% calc(100% - 0.38px) with 84% calc(100% - 0.53px), curve to 4.4px calc(100% - 0.72px) with 28% calc(100% - 0.61px), curve to 0.58px calc(100% - 4.4px) with 0.5px calc(100% - 0.5px), curve to 1.0px 56% with 0.71px 77%, curve to 0.51px 6.3px with 1.08px 24%, curve to 6.3px 0.61px with 0.5px 0.5px); }
    .worn .bubble:nth-child(7n+6) { --edge: shape(from 4.9px 0.51px, curve to 44% 0.89px with 19% 0.79px, curve to calc(100% - 5.2px) 0.01px with 70% 1.02px, curve to calc(100% - 0.83px) 5.2px with calc(100% - 0.5px) 0.5px, curve to calc(100% - 1.19px) 51% with calc(100% - 0.03px) 27%, curve to calc(100% - 1.2px) calc(100% - 5.0px) with calc(100% - 0.32px) 72%, curve to calc(100% - 5.0px) calc(100% - 1.01px) with calc(100% - 0.5px) calc(100% - 0.5px), curve to 60% calc(100% - 0.79px) with 83% calc(100% - 0.57px), curve to 5.1px calc(100% - 0.78px) with 26% calc(100% - 1.23px), curve to 0.98px calc(100% - 5.1px) with 0.5px calc(100% - 0.5px), curve to 0.45px 55% with 0.98px 75%, curve to 0.62px 4.9px with 0.65px 25%, curve to 4.9px 1.19px with 0.5px 0.5px); }
    .worn .bubble:nth-child(7n+7) { --edge: shape(from 5.3px 0.96px, curve to 45% 0.68px with 20% 0.14px, curve to calc(100% - 5.9px) 0.03px with 72% 1.02px, curve to calc(100% - 0.52px) 5.9px with calc(100% - 0.5px) 0.5px, curve to calc(100% - 1.07px) 52% with calc(100% - 0.8px) 30%, curve to calc(100% - 0.17px) calc(100% - 6.3px) with calc(100% - 0.69px) 72%, curve to calc(100% - 6.3px) calc(100% - 1.02px) with calc(100% - 0.5px) calc(100% - 0.5px), curve to 53% calc(100% - 0.19px) with 84% calc(100% - 0.7px), curve to 4.7px calc(100% - 1.19px) with 25% calc(100% - 0.41px), curve to 0.15px calc(100% - 4.7px) with 0.5px calc(100% - 0.5px), curve to 0.89px 44% with 0.39px 71%, curve to 0.63px 5.3px with 1.07px 29%, curve to 5.3px 1.25px with 0.5px 0.5px); }

    /* As in app.css */
    @keyframes bounce {
        0%, 25%, 50%, 75%, 100% { transform-origin: 50% 100%; }
        0%, 100% { scale: 1; transform: skew(0deg, 0deg); }
        25% { scale: 1.0022 1.0333; transform: skew(1.111deg, 0deg); }
        50% { scale: 1; transform: skew(0deg, 0deg); rotate: -0.222deg; }

<body>
<div class="tools">
    <span>Тема:
        <button data-set="theme" data-value="both">обе</button>
        <button data-set="theme" data-value="dark">тёмная</button>
        <button data-set="theme" data-value="light">светлая</button>
    </span>
</div>
<main class="screens"></main>

<script>
(function () {
    const options = { theme: 'both' };

    /* ---- colours: core/tokens.js and catalog.setTheme ---- */

    const DAY = {
        ground: '#e8dfd0', surface: '#ffffff', border: '#ddd2bf', ink: '#153040', muted: '#655b4f', chrome: '#b9a782',
        plate: '#e8dfd0', stepIdle: '#ebedef', stepEdge: 0.78
    };
    const NIGHT = {
        ground: '#0f2b3c', surface: '#1a4154', border: '#2a5568', ink: '#eef6f7', muted: '#9bb4c1', chrome: '#2a5568',
        plate: '#16384a', stepIdle: '#16384a', stepEdge: 0
    };

    const STAGES = [
        ['#ebedef', '#4a4f55', '#6d737a'], ['#fbedc3', '#605024', '#857447'], ['#f8eabf', '#605124', '#857647'],
        ['#ebf1bb', '#596024', '#7d8547'], ['#d4efb9', '#426024', '#668547'], ['#c0edb9', '#2c6024', '#508547'],
        ['#bdefc8', '#246032', '#478556'], ['#bff0dc', '#246048', '#47856c'], ['#bcf0f0', '#246060', '#478585'],
        ['#b8dff0', '#244e60', '#477285'], ['#b4ccf0', '#243c60', '#476085'], ['#b1b1f0', '#242460', '#474785'],
        ['#c6adf1', '#3a2460', '#5e4785'], ['#c7a2f1', '#402460', '#644785'], ['#cb91f2', '#482460', '#6c4785']
    ];
    const FAIL = '#ff1744';
    const MARK = '#52525bcc';

    const shade = (hex, by) => {
        const n = parseInt(hex.slice(1), 16);
        return `rgb(${[16, 8, 0].map(s => Math.round(((n >> s) & 255) * by)).join(', ')})`;
    };

    /* ---- marks, as marksSvg draws them ---- */

    // o right, x wrong, . missed, e early right, f early wrong
    function marksSvg(marks) {
        if (!marks) return '';

        const GAP = 0.6, LINE = 4, WIDTH = 290;
        const size = (m) => (m === '.' ? 2 : 4);
        const lines = [];
        Array.from(marks).forEach(m => {
            const last = lines[lines.length - 1];
            if (last && last.w + GAP + size(m) <= WIDTH) { last.items.push(m); last.w += GAP + size(m); }
            else lines.push({ items: [m], w: size(m) });
        });

        const w = Math.max(...lines.map(l => l.w));
        const h = lines.length * LINE + (lines.length - 1) * GAP;
        const body = lines.map((l, n) => {
            let x = (w - l.w) / 2;
            const cy = n * (LINE + GAP) + LINE / 2;
            return l.items.map(m => {
                const s = size(m);
                const cx = x + s / 2;
                x += s + GAP;
                const ink = m === 'x' || m === 'f' ? FAIL : MARK;
                return m === 'e' || m === 'f'
                    ? `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="1.4" fill="none" stroke="${ink}" stroke-width="1.2"/>`
                    : `<circle cx="${cx.toFixed(2)}" cy="${cy.toFixed(2)}" r="${s / 2}" fill="${ink}"/>`;
            }).join('');
        }).join('');

        return `<svg width="${w.toFixed(2)}" height="${h.toFixed(2)}" viewBox="0 0 ${w.toFixed(2)} ${h.toFixed(2)}" style="display:block;overflow:visible">${body}</svg>`;
    }

    function bubbleHtml(w, order) {
        const [word, trans, stage, marks, timer] = w;
        const failed = /[xf]$/.test((marks || '').replace(/\./g, ''));
        const [fill, ink, sub] = STAGES[stage];
        const tone = stage === 1 ? STAGES[0][0] : fill;
        const hop = stage > 0 && !timer ? `animation: bounce ${failed ? 3250 : 650}ms ease-in-out ${-order * 170}ms infinite;` : '';
        const badge = timer ? `<span style="position: absolute; bottom: -5px; right: -4px; z-index: 3; font-size: 9.2px; font-weight: 800; line-height: 1; padding: 1.5px 3.8px; border-radius: 10.2px; box-shadow: 0 2px 3.4px rgba(0,0,0,0.18); white-space: nowrap; letter-spacing: -0.2px; background: #1f8469; color: #ffffff;">${timer}</span>` : '';

        return `<div class="bubble" style="--tone: ${tone}; ${hop}">`
            + `<span class="word" style="color: ${failed ? FAIL : ink}">${word}</span>`
            + `<span class="dots">${marksSvg(marks)}</span>`
            + `<span class="trans" style="color: ${failed ? FAIL : sub}">${trans}</span>`
            + badge + `</div>`;
    }

    /* ---- the set card, as renderSetCard draws it ---- */

    const ICON = (body) => `<svg width="15.4" height="15.4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block">${body}</svg>`;

    const PEN = ICON('<path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>');
    const EYE = ICON('<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>');
    const CHEVRON = ICON('<path d="M9 5l7 7-7 7"/>');

    const svg24 = (body) => `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block">${body}</svg>`;
    const GAMES = [
        { name: 'Flashcards', tone: '#ef6f5a', face: svg24('<g transform="rotate(-8 12 12)"><path d="M6 9.4V6.6a2 2 0 0 1 2-2h9.4" transform="rotate(16 10.5 6.4)"/><rect x="3" y="8.8" width="17.4" height="11" rx="2.6"/></g>') },
        { name: 'Quiz', tone: '#d9a520', face: svg24('<path d="M2.6 8.2 L5.2 10.8 L9.4 5"/><path d="M12.6 8h8.4"/><path d="M3.2 13.2 L8.8 18.8"/><path d="M8.8 13.2 L3.2 18.8"/><path d="M12.6 16h8.4"/>') },
        { name: 'Wordcraft', tone: '#9b72d4', face: svg24('<g fill="currentColor" stroke="none"><rect x="1.4" y="8.1" width="5.6" height="7.8" rx="1.4"/><rect x="9.2" y="8.1" width="5.6" height="7.8" rx="1.4"/><rect x="17" y="8.1" width="5.6" height="7.8" rx="1.4" fill-opacity="0.4"/></g>') },
        { name: 'Snake', tone: '#4a90d9', face: (tone) => `<svg width="50" height="50" viewBox="30 30 340 340" style="display:block"><g transform="matrix(1.4 0 0 1.4 -89 -345.2)"><path d="M137.17 489.59C137.38 485.68 141.01 482.26 141.03 477.67C141.07 468.74 134.95 461.53 134.12 452.67C133.2 442.86 137.51 432.75 145.17 426.69C191.95 389.66 199.67 487.31 229.74 459.67C239.63 450.58 235.34 437.01 226.5 429.21C188.26 395.49 160.35 412.87 160.35 344.33C160.35 330.58 155.94 307.77 172.83 302.05C188.09 296.88 248.13 296 251.88 316C254.49 329.92 256.11 354.71 243.5 363.67C235.06 369.66 199.52 360.17 201.5 375.81C203.07 388.18 308.14 423.8 249.5 479.53C242.36 486.31 232.01 489.56 222.33 490.13C177.72 492.78 179.06 435.44 157.93 442C143.08 446.61 161.76 495.45 137.17 489.59Z" fill="currentColor"/><g fill="${tone}"><circle cx="192.4" cy="331.7" r="17.5"/><circle cx="228.8" cy="332.4" r="9.1"/></g><g fill="currentColor"><circle cx="197.9" cy="330.2" r="6.5"/><circle cx="231.2" cy="331.8" r="3.2"/></g></g></svg>` },
        { name: 'Word search', tone: '#2f9e6e', face: (tone) => svg24(`<path d="M5 19V12H12V5H19" stroke-width="6.4" opacity="0.92"/><g stroke="none"><g fill="${tone}"><circle cx="5" cy="19" r="2.2"/><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="12" cy="5" r="2.2"/><circle cx="19" cy="5" r="2.2"/></g><g fill="currentColor" opacity="0.5"><circle cx="5" cy="5" r="2.2"/><circle cx="19" cy="12" r="2.2"/><circle cx="12" cy="19" r="2.2"/><circle cx="19" cy="19" r="2.2"/></g></g>`) },
        { name: 'Word search 2', tone: '#cf4f86', face: svg24('<g fill="currentColor" stroke-width="1.2"><path d="M15.3 19.45L13.65 22.31L10.35 22.31L8.7 19.45L10.35 16.59L13.65 16.59ZM8.85 15.72L7.2 18.58L3.9 18.58L2.25 15.72L3.9 12.87L7.2 12.87ZM15.3 12L13.65 14.86L10.35 14.86L8.7 12L10.35 9.14L13.65 9.14ZM21.75 8.28L20.1 11.13L16.8 11.13L15.15 8.28L16.8 5.42L20.1 5.42Z"/><path d="M15.3 4.55L13.65 7.41L10.35 7.41L8.7 4.55L10.35 1.69L13.65 1.69ZM8.85 8.28L7.2 11.13L3.9 11.13L2.25 8.28L3.9 5.42L7.2 5.42ZM21.75 15.72L20.1 18.58L16.8 18.58L15.15 15.72L16.8 12.87L20.1 12.87Z" opacity="0.45"/></g>') }
    ];

    function ladder(words, p) {
        const climbed = (s) => Math.max(0, Math.min(13, s - 1));
        const stages = words.map(w => w[2]);
        const lit = climbed(Math.max(...stages));
        const grown = climbed(Math.min(...stages));
        const steps = Array.from({ length: 13 }, (_, i) => {
            const on = i < lit;
            const colour = on ? STAGES[i + 2][0] : p.stepIdle;
            const edge = on && p.stepEdge ? ` box-shadow: 0 0 0 0.5px ${shade(colour, p.stepEdge)};` : '';
            return `<div style="flex: 1; display: flex; justify-content: center;"><div style="flex: none; width: ${i < grown ? '100%' : '9.4px'}; height: 9.4px; border-radius: 4.7px; background-color: ${colour};${edge}"></div></div>`;
        }).join('');
        return `<div style="display: flex; align-items: center; gap: 3.4px; height: 9.4px; margin-bottom: 6px;">${steps}</div>`;
    }

    function tilesHtml(p) {
        return GAMES.map(g => `<button style="flex: 0 0 calc((100% - 20.4px) / 5); min-width: 0; padding: 0; background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5.1px;">
            <span style="display: grid; place-items: center; width: 50px; height: 50px; flex: none; overflow: hidden; border-radius: 16.67px; background: ${g.tone}; color: #ffffff;">${typeof g.face === 'function' ? g.face(g.tone) : g.face}</span>
            <span style="width: max-content; font-size: 10.8px; font-weight: 600; line-height: 1.2; color: ${p.ink}; white-space: nowrap;">${g.name}</span>
        </button>`).join('');
    }

    function setCard(set, p) {
        const btn = (cls, icon, turn) => `<button class="${cls}" style="display: inline-flex; align-items: center; justify-content: center; width: 27.3px; height: 27.3px; padding: 0; background: transparent; color: ${p.muted}; border: none; border-radius: 10.2px; cursor: pointer;"><span style="display: block; line-height: 0;${turn === undefined ? '' : ` transform: rotate(${turn}deg); transition: transform 0.18s ease-out;`}">${icon}</span></button>`;

        return `<div class="set" style="background: ${p.surface}; border: 1px solid ${p.border}; border-radius: 15.4px; padding: 13.7px;">
            <div style="display: flex; gap: 4.3px; justify-content: space-between; align-items: center; margin-bottom: 6.8px;">
                <div style="display: flex; align-items: center; gap: 6.8px; min-width: 0;">
                    <h4 style="margin: 0; padding: 4.4px 0; min-width: 0; line-height: 18.5px; font-size: 15.4px; color: ${p.ink}; font-weight: 700; overflow-wrap: anywhere;">${set.title}</h4>
                    <span style="flex-shrink: 0; background: ${p.plate}; color: ${p.muted}; font-size: 10.8px; font-weight: 800; padding: 2.6px 6.8px; border-radius: 999px; line-height: 1;">${set.words.length}${set.percent ? ` · ${set.percent}%` : ''}</span>
                </div>
                <div style="display: flex; align-items: center; gap: 1.7px; flex: none;">${btn('pen', PEN)}${btn('eye', EYE)}${btn('fold', CHEVRON, set.folded ? 0 : 90)}</div>
            </div>
            ${ladder(set.words, p)}
            <div class="words-fold" style="overflow: hidden; margin: 0 -6px;"${set.folded ? ' hidden' : ''}>
                <div style="padding: 6px; display: flex; flex-wrap: wrap; gap: 5.1px; justify-content: center;">${set.words.map(bubbleHtml).join('')}</div>
            </div>
            <div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 10.2px 5.1px; padding-top: 9.4px;">${tilesHtml(p)}</div>
        </div>`;
    }

    /* ---- the sets ---- */

    const SETS = [
        {
            title: 'Слова набора', percent: 46,
            words: [
                ['wonder', 'чудо', 2, 'o'],
                ['brave', 'смелый', 3, 'oo', '12m'],
                ['journey', 'путешествие', 8, 'o.oo..o..oo..o'],
                ['forest', 'лес', 4, 'oo.o'],
                ['spark', 'искра', 5, 'ooo.o', '2h'],
                ['adventure', 'приключение', 9, 'o.oo...o.oo..o.o', '6d'],
                ['mist', 'туман', 6, 'ooo.oo'],
                ['cozy', 'уютный', 1, 'oox'],
                ['apple', 'яблоко', 0, ''],
                ['heart', 'сердце', 4, 'ooooox', '40m'],
                ['story', 'история', 10, 'oo.o..oo..o...oo'],
                ['star', 'звезда', 7, 'ooeo.oo', '1d'],
                ['book', 'книга', 12, 'oooo.o..o...o...oo', '58d'],
                ['focus', 'сосредоточенность', 11, 'oo.oo..o...o..oo'],
                ['sky', 'небо', 0, ''],
                ['dream', 'мечта', 13, 'ooo.oo..o..o....o.oo'],
                ['to pull oneself together', 'взять себя в руки', 14, 'oooo.o..o...o....o....oo', '212d']
            ]
        },
        {
            title: 'Español A1: первые слова', percent: 0,
            words: [
                ['la casa', 'дом', 0, ''], ['el agua', 'вода', 0, ''], ['gracias', 'спасибо', 0, ''],
                ['hola', 'привет', 0, ''], ['el amigo', 'друг', 0, ''], ['por favor', 'пожалуйста', 0, ''],
                ['comer', 'есть', 0, ''], ['dormir', 'спать', 0, ''], ['mañana', 'завтра', 0, '']
            ]
        },
        {
            title: 'Phrasal verbs, которые всё время забываются', percent: 81, folded: true,
            words: [
                ['give up', 'сдаваться', 7, 'ooo.o'], ['look for', 'искать', 9, 'oooo.o'], ['run out of', 'закончиться', 11, 'oooooo'],
                ['put off', 'откладывать', 8, 'ooo.o.o'], ['get along', 'ладить', 10, 'oo.oo..o.o', '4d'], ['find out', 'выяснить', 7, 'ooeo.o']
            ]
        }
    ];

    /* ---- the page ---- */

    function headerHtml(p) {
        return `<div style="margin: -6.8px -6.8px 0; padding: 6.8px; display: flex; justify-content: space-between; align-items: center;">
            <h1 style="margin: 0; min-height: 34.1px; display: flex; align-items: center; gap: 7.7px; color: ${p.ink};">
                <svg width="34.1" height="34.1" viewBox="0 0 32 32" style="display: block; flex-shrink: 0;"><g transform="rotate(-7 16 16)"><rect x="1.95" y="4.34" width="28.09" height="23.31" rx="5.23" fill="#ef6f5a"/><circle cx="11.37" cy="16" r="4.405" fill="#0f2b3c" stroke="#fff" stroke-width="2.41"/><circle cx="23.02" cy="16" r="3.01" fill="#0f2b3c" stroke="#fff" stroke-width="1.5"/></g></svg>
                <span style="display: block; line-height: 1.06;"><span style="display: block; font-size: 15.4px; font-weight: 800; letter-spacing: 0.235em;">SPACED</span><span style="display: block; font-size: 12.4px; font-weight: 700; letter-spacing: 0.075em;">REPETITION</span></span>
            </h1>
            <div style="display: flex; align-items: center; gap: 6.8px;">
                <button style="height: 29px; padding: 0 10.2px; background: transparent; color: ${p.muted}; border: 1px solid ${p.chrome}; border-radius: 10.2px; font-weight: 600; font-size: 12.8px; cursor: pointer;">+ New set</button>
                <button style="display: inline-flex; align-items: center; justify-content: center; width: 29px; height: 29px; padding: 0; background: transparent; border: 1px solid ${p.chrome}; border-radius: 10.2px; color: ${p.muted}; cursor: pointer;">${ICON('<path d="M21.60 12.00 C21.60 12.69 20.40 13.54 19.73 14.07 C19.05 14.60 17.89 14.60 17.54 15.20 C17.20 15.80 17.78 16.80 17.66 17.66 C17.53 18.51 17.40 19.97 16.80 20.31 C16.20 20.66 14.87 20.05 14.07 19.73 C13.27 19.41 12.69 18.40 12.00 18.40 C11.31 18.40 10.73 19.41 9.93 19.73 C9.13 20.05 7.80 20.66 7.20 20.31 C6.60 19.97 6.47 18.51 6.34 17.66 C6.22 16.80 6.80 15.80 6.46 15.20 C6.11 14.60 4.95 14.60 4.27 14.07 C3.60 13.54 2.40 12.69 2.40 12.00 C2.40 11.31 3.60 10.46 4.27 9.93 C4.95 9.40 6.11 9.40 6.46 8.80 C6.80 8.20 6.22 7.20 6.34 6.34 C6.47 5.49 6.60 4.03 7.20 3.69 C7.80 3.34 9.13 3.95 9.93 4.27 C10.73 4.59 11.31 5.60 12.00 5.60 C12.69 5.60 13.27 4.59 14.07 4.27 C14.87 3.95 16.20 3.34 16.80 3.69 C17.40 4.03 17.53 5.49 17.66 6.34 C17.78 7.20 17.20 8.20 17.54 8.80 C17.89 9.40 19.05 9.40 19.73 9.93 C20.40 10.46 21.60 11.31 21.60 12.00 Z"/><circle cx="12" cy="12" r="3"/>')}</button>
            </div>
        </div>`;
    }

    const screens = document.querySelector('.screens');

    // Which sets are folded, in each theme by itself
    const start = () => SETS.map(s => !!s.folded);
    const folded = { dark: start(), light: start() };

    function render() {
        document.querySelectorAll('.tools button').forEach(b => b.setAttribute('aria-pressed', options[b.dataset.set] === b.dataset.value));

        const themes = options.theme === 'both' ? ['dark', 'light'] : [options.theme];
        screens.innerHTML = '';

        themes.forEach(theme => {
            const p = theme === 'dark' ? NIGHT : DAY;
            const screen = document.createElement('section');
            screen.className = 'screen';
            screen.style.background = p.ground;
            const half = (s, i, look, caption) => `<div class="${look}" data-set-no="${i}"><p class="caption" style="color: ${p.muted};">${caption}</p>${setCard({ ...s, folded: folded[theme][i] }, p)}</div>`;
            screen.innerHTML = `<div class="app">${headerHtml(p)}<div class="pairs">${SETS.map((s, i) => half(s, i, 'now', 'Как сейчас') + half(s, i, 'worn', 'Новая форма')).join('')}</div></div>`;
            screens.appendChild(screen);

            // The two of a pair fold together, to stay level
            screen.querySelectorAll('[data-set-no]').forEach(el => el.querySelector('.fold').addEventListener('click', () => {
                const i = +el.dataset.setNo;
                const open = folded[theme][i];
                folded[theme][i] = !open;
                screen.querySelectorAll(`[data-set-no="${i}"]`).forEach(one => {
                    foldOut(one.querySelector('.words-fold'), open);
                    one.querySelector('.fold span').style.transform = `rotate(${open ? 90 : 0}deg)`;
                });
            }));
        });
    }

    // As foldOut in the catalog
    function foldOut(el, open) {
        clearTimeout(el.timer);
        if (open) el.hidden = false;
        el.style.opacity = open ? '0' : '1';
        el.style.maxHeight = open ? '0px' : `${el.scrollHeight}px`;
        void el.offsetHeight;
        const ms = open ? 190 : 150;
        el.style.transition = `max-height ${ms}ms ${open ? 'ease-out' : 'ease-in'}, opacity ${ms}ms ${open ? 'ease-out' : 'ease-in'}`;
        el.style.opacity = open ? '1' : '0';
        el.style.maxHeight = open ? `${el.scrollHeight}px` : '0px';
        el.timer = setTimeout(() => {
            if (!open) el.hidden = true;
            el.style.maxHeight = el.style.opacity = el.style.transition = '';
        }, ms + 40);
    }

    document.querySelector('.tools').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        options[b.dataset.set] = b.dataset.value;
        render();
    });

    render();
})();
</script>
</body>

</html>
