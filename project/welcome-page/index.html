<meta name="description" content="Spaced Repetition App is installed. Pin it for fast access and open it to start learning.">
<meta name="theme-color" content="#e0fff5">
<meta property="og:title" content="Welcome!">
<meta property="og:description" content="You have installed the Spaced Repetition App extension.">

<style>
:root {
    color-scheme: light;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    /* Named because it is used twice and the two uses must not drift: the page
       is painted in it, and so is the fade at the bottom of each shot. Let them
       differ and the fade shows up as a band of the wrong tint. The colour is
       repeated once more, in the theme-color meta, where a variable cannot
       reach. */
    --page: #e0fff5;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 56px 20px 80px;
    background: var(--page);
    color: #1d1d1f;
    font: 400 19px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-align: center;
}

main { max-width: 900px; margin: 0 auto; }

p { margin: 0; }

.lead { font-size: clamp(19px, 3.4vw, 23px); }

.step { margin-top: 64px; }

figure {
    margin: 22px 0 0;
    position: relative;
}

/* The page is not white, so that the shots — which are white to their edges —
   read as objects lying on it rather than as part of it. The rounded corner and
   the shadow do the rest of that work.

   An outer box-shadow is never painted inside the box that casts it, which is
   the whole reason it is back here. The fade below used to be a mask, and a
   mask makes the picture itself half transparent: with drop-shadow on the
   figure — a filter, which has no such clipping — the blurred shadow sat
   behind that half-transparent strip and showed straight through it as dirt.
   Nothing is transparent any more, so there is nothing to show through. */
figure img {
    display: block;
    width: 100%;
    height: auto;
    margin-inline: auto;
    border-radius: 14px;
    box-shadow: 0 6px 28px rgba(0, 0, 0, .16);
}

/* The fade at the bottom, painted over the picture in the page's own colour
   rather than taken out of it.

   Below the last of the content both shots are nothing but empty browser
   viewport, and a hard line ruled across that reads as a crop rather than as
   the end of the picture. 80% is where the fade starts because that is just
   past the lowest thing either shot has to show — the second arrow in the pin
   shot, which ends at 79.5% of its height. Start it any higher and the fade
   eats the picture.

   Two background layers, because the strip has two jobs and they meet exactly
   at the bottom edge of the picture: the gradient covers the picture's own last
   fifth and arrives at full colour precisely there, and the flat block below it
   hides the 40px of shadow the picture casts onto the page. Sized from the top
   and the bottom rather than in the middle, so the seam stays on that edge at
   every width. A shadow left showing under a picture that has faded out is the
   same crop line by another name.

   20px at the sides is enough to cover the shadow there (14px of blur) and no
   more: the figure already sits in the body's own 20px of padding, so anything
   wider would push a scrollbar onto a narrow screen.

   All of this only works against a flat background — see --page. */
figure::after {
    content: "";
    position: absolute;
    top: 80%;
    left: -20px;
    right: -20px;
    bottom: -40px;
    pointer-events: none;
    background:
        linear-gradient(to bottom, transparent, var(--page)) top / 100% calc(100% - 40px) no-repeat,
        linear-gradient(var(--page), var(--page)) bottom / 100% 40px no-repeat;
}

/* Both are the same 900px-wide browser shot: shown at their own size, never
   enlarged. */
.pin, .popup { max-width: 900px; }

/* The way out for the one visitor this page was not written for.

   Everything above assumes the reader has just installed the extension — the
   first line congratulates them on it. Search engines do not care: the page is
   indexable, it is the only page on the domain, and whoever lands here from a
   result has read a congratulation for something they have not done and has
   nowhere to go. One link fixes that.

   Set apart rather than dressed as a button. For the visitor the page IS
   addressed to, this line is noise, and a call-to-action competing with "pin
   it" would be worse than noise. */
.store {
    margin-top: 72px;
    font-size: 15px;
    color: #5c6a66;
}

.store a { color: inherit; }

@media (max-width: 560px) {
    body { padding-top: 40px; }
    .step { margin-top: 48px; }
    .store { margin-top: 56px; }
}
</style>
</head>

    <figure>
        <img class="pin" src="pin-extension.png" width="900" height="443"
